name: Update portfolio

# No schedule trigger: TryHackMe's API sits behind a Vercel bot-protection
# firewall that consistently challenge-blocks requests from GitHub-hosted
# runners' datacenter IPs. The daily sync now runs from a local scheduled
# task on a home IP instead (see SETUP.md). This workflow is kept as a
# manual fallback you can try from the Actions tab, but expect it to fail
# the same way until/unless that changes.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch TryHackMe data
        env:
          THM_USERNAME: ${{ vars.THM_USERNAME }}
        run: python scripts/fetch_thm.py

      - name: Render README
        run: python scripts/render_readme.py

      - name: Commit changes if anything updated
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/thm_data.json README.md
          git diff --cached --quiet || git commit -m "chore: sync TryHackMe stats"
          git push
