title: Key Vault Access From an Identity With No Prior Vault History
name: azure_keyvault_first_seen_identity
id: 8c25a0f7-6b43-4e19-b70d-95f2ce8a41d6
status: experimental
description: >
  A Key Vault data-plane operation performed by a service principal. In the
  Azure Cloud Attack Chain assessment this is the step that turned a stolen
  credential into secret disclosure: the service principal from F-02 was
  authenticated with credentials read out of blob storage, then used to reach a
  vault the original tester had no access to.
  This rule is written as a hunting query rather than an alert, and it is
  deliberately honest about why. The malicious access and a legitimate one are
  the same API call by the same identity; what separates them is that this
  identity had never touched this vault before, and Sigma has no way to express
  "first time seen". Deployed as written it fires on all service-principal vault
  access. It becomes a detection only once paired with a baseline of which
  identities legitimately touch which vaults, which is the platform's job.
references:
  - reports/cloud-attack-chain-azure-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.credential-access
  - attack.t1555.006
  - attack.lateral-movement
  - attack.t1550.001
logsource:
  product: azure
  service: keyvault
detection:
  data_plane_read:
    OperationName:
      - 'SecretGet'
      - 'SecretList'
      - 'KeyGet'
      - 'CertificateGet'
  condition: data_plane_read
falsepositives:
  - All routine application access to Key Vault, which is the overwhelming
    majority of these events. This rule is not deployable as an alert without
    an identity-to-vault baseline.
level: informational
---
title: Storage Account Enumeration Using a Shared Access Signature
name: azure_sas_container_enumeration
id: 2f9b71e4-3a6c-4d05-8e93-c07b41a2d8f5
status: experimental
description: >
  Blob storage list operations authenticated with a Shared Access Signature.
  This is finding F-01 in the Azure Cloud Attack Chain assessment, where a SAS
  token embedded in client-side JavaScript carried read and list permissions
  across the whole storage account, while the application it belonged to only
  ever needed to write to one container.
  The signal is the mismatch between what the token can do and what the
  application does. A correctly scoped write-only SAS produces no list
  operations at all, so any listing authenticated by SAS is worth reading.
references:
  - reports/cloud-attack-chain-azure-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.discovery
  - attack.t1619
  - attack.collection
  - attack.t1530
logsource:
  product: azure
  service: storage
detection:
  list_operation:
    OperationName:
      - 'ListBlobs'
      - 'ListContainers'
  sas_authenticated:
    AuthenticationType: 'SAS'
  condition: list_operation and sas_authenticated
falsepositives:
  - An application that legitimately uses a SAS for read and list, for example
    a media gallery. Where that is the design, this rule belongs on the
    accounts where it is not, rather than being disabled everywhere.
  - Administrative tooling and storage browsers operating with a delegated SAS.
level: medium
