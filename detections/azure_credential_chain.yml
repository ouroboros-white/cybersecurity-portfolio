title: Key Vault Secret Read Against an Explicit Version
name: azure_keyvault_versioned_secret_read
id: b4e07d29-5f31-4c88-9a26-3e1d78b0c5fa
status: experimental
description: >
  A Key Vault SecretGet that names an explicit secret version in the request
  URI rather than requesting the current value. This is finding F-03 in the
  Azure Cloud Attack Chain assessment, where a secret had been "rotated" by
  writing a placeholder over it while Key Vault continued to serve every prior
  version on request, leaving the real value fully readable.
  Legitimate automation reads the current value, because that is the point of
  rotation: an application that pinned itself to a version would break at the
  next rotation. An explicit version in the URI is therefore unusual by
  construction, and it is the access pattern that recovered the leaked secret.
  Read the limitation below before deploying this. Sigma cannot express "not
  the current version", because that requires state the rule does not have.
  This matches any explicitly versioned read, so its precision depends on
  legitimate callers not pinning versions.
references:
  - reports/cloud-attack-chain-azure-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: azure
  service: keyvault
detection:
  secret_read:
    OperationName: 'SecretGet'
  explicit_version:
    RequestUri|re: '/secrets/[^/?]+/[0-9a-f]{32}'
  condition: secret_read and explicit_version
falsepositives:
  - An application deliberately pinned to a specific secret version, which is
    rare and should be inventoried rather than assumed. Once identified, filter
    by that caller identity rather than by the secret name, so the same read
    from a different identity still alerts.
  - Backup, replication, or migration tooling enumerating version history,
    which is distinguishable by reading many secrets rather than one.
level: high
