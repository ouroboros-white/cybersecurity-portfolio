title: SSH Failed Password Authentication
name: ssh_failed_password
id: 8f3c1a94-6d2e-4b71-9c05-2ad7e4f11b83
status: experimental
description: >
  Base rule. Matches a single failed SSH password authentication in Linux
  authentication logs. One of these events is ordinary noise, so this rule is
  not intended to alert on its own; it exists to be counted and correlated by
  the two rules below.
references:
  - reports/smb-to-multiuser-compromise-2026-08.md
author: ouroboros-white
date: 2026/08/20
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    - 'Failed password for'
  condition: selection
falsepositives:
  - Users or automation with a stale cached password, typically a low and
    steady failure rate against one account rather than a burst.
  - Vulnerability scanners and authorised credential-testing activity.
level: informational
---
title: SSH Brute Force Burst Against a Single Account
name: ssh_bruteforce_burst
id: 2b6d0c17-45ae-4f8a-8de3-9c1f7a55e402
status: experimental
description: >
  Ten or more failed SSH password attempts for the same account from the same
  source address inside five minutes. This is the signature produced by finding
  F-02 in the Network Share to Root assessment, where an automated wordlist
  attack was run against a known-valid username. A legitimate user with a stale
  saved password fails at a low, steady rate rather than in a burst of this
  shape.
references:
  - reports/smb-to-multiuser-compromise-2026-08.md
author: ouroboros-white
date: 2026/08/20
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - ssh_failed_password
  group-by:
    - user
    - src_ip
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - A misconfigured service or scheduled job retrying a dead credential in a
    tight loop, which produces the burst shape without an attacker.
level: high
---
title: SSH Successful Password Authentication
name: ssh_accepted_password
id: c47a9f10-3b85-4e26-8d51-6f2ec0b7a934
status: experimental
description: >
  Base rule. Matches a successful SSH password authentication. Ordinary and
  expected on its own; it exists to be correlated against a preceding brute
  force burst by the rule below.
references:
  - reports/smb-to-multiuser-compromise-2026-08.md
author: ouroboros-white
date: 2026/08/20
tags:
  - attack.initial-access
  - attack.t1078.003
logsource:
  product: linux
  service: sshd
detection:
  selection:
    - 'Accepted password for'
  condition: selection
falsepositives:
  - Every legitimate password-based SSH login. This rule must not be alerted on
    directly.
level: informational
---
title: SSH Brute Force Succeeded
name: ssh_bruteforce_success
id: 5e1d8c73-92f4-4a60-b7c8-01ab3d6e5f27
status: experimental
description: >
  A brute force burst against an account, followed inside ten minutes by a
  successful password login for that same account from that same source. This
  is a compromise rather than an attempt, and is the sequence that actually
  occurred during the Network Share to Root assessment: the target host enforced
  neither lockout nor rate limiting, so the wordlist attack ran uninterrupted
  until it succeeded and returned an interactive shell.
  Triage as an active intrusion. The account should be treated as attacker
  controlled until proven otherwise.
references:
  - reports/smb-to-multiuser-compromise-2026-08.md
author: ouroboros-white
date: 2026/08/20
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.initial-access
  - attack.t1078.003
correlation:
  type: temporal_ordered
  rules:
    - ssh_bruteforce_burst
    - ssh_accepted_password
  group-by:
    - user
    - src_ip
  timespan: 10m
falsepositives:
  - Authorised credential-testing or red-team activity, which produces this
    sequence legitimately and should be confirmed against the engagement
    window rather than assumed benign.
level: critical
