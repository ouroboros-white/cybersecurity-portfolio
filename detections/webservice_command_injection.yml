title: Root Automation Worker Spawning an Unexpected Child Process
name: root_worker_unexpected_child
id: 3a80f5c2-91d7-4b64-8e15-6c4d9a2e70b8
status: experimental
description: >
  A root-privileged automation worker spawns a process other than the single
  utility its function requires. This is finding F-04 in the Command-Injection
  Chain assessment, where the export worker interpolated a caller-supplied field
  into a tar command and ran it as root, so any metacharacter in that field
  executed as root.
  This rule is critical rather than high because of what the parent is, not what
  the child is. The identical child process under an unprivileged account is
  finding F-01 and is already covered above; here it is immediate root
  compromise of the host.
  The worker's executable path and its one expected child are environment
  specific and must be set for the deployment before this rule is used. The
  values below reflect the assessed target.
references:
  - reports/command-injection-chain-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.execution
  - attack.t1059.004
  - attack.privilege-escalation
  - attack.t1068
logsource:
  category: process_creation
  product: linux
detection:
  worker_as_root:
    ParentImage|contains: 'export-worker'
    User: 'root'
  expected_child:
    Image|endswith: '/tar'
  condition: worker_as_root and not expected_child
falsepositives:
  - A genuine change to the worker's implementation, for example adding
    compression by calling gzip directly. This is a rule-maintenance event
    rather than a false positive, and the allowed child list should be updated
    deliberately when the worker changes.
  - Package upgrades that restart the worker under a wrapper script, which
    briefly produces unexpected children at a predictable time.
level: critical
---
title: Archive Utility Invoked With Execution-Capable Flags
name: tar_execution_flags
id: 6f13d9b4-2c57-4e80-a3f9-8d05be7c1a92
status: experimental
description: >
  tar or a comparable archive utility invoked with a flag that executes an
  arbitrary command. This closes an evasion path against the root worker rule
  above, which permits tar because tar is the worker's legitimate function.
  An attacker who reads that rule, or who simply works within the command the
  worker already runs, does not need to spawn anything else: tar's own
  checkpoint-action, --to-command, and --use-compress-program flags each execute
  a supplied command, so the injection succeeds while the child process remains
  the expected one.
  This is the rule the F-04 finding most needs, because the allowed-child
  approach on its own is defeated by the allowed child.
references:
  - reports/command-injection-chain-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.execution
  - attack.t1059.004
  - attack.stealth
  - attack.t1202
logsource:
  category: process_creation
  product: linux
detection:
  archive_utility:
    Image|endswith:
      - '/tar'
      - '/bsdtar'
  execution_flags:
    CommandLine|contains:
      - '--checkpoint-action'
      - '--to-command'
      - '--use-compress-program'
      - '-I '
  condition: archive_utility and execution_flags
falsepositives:
  - Backup tooling legitimately using --use-compress-program to select a
    compressor such as pigz or zstd. This is common and should be filtered by
    the specific program named, not by removing the flag from the rule.
  - Build scripts using -I to select a decompressor, which is distinguishable
    by running under a build account rather than a service account.
level: high
