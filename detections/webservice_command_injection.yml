title: Web Service Account Spawning a Shell Interpreter
name: webservice_shell_child
id: 1c9f4e07-8a35-4d62-b0e1-77c3a9f2e5d4
status: experimental
description: >
  A process running as the web application's service account spawns a shell
  interpreter. This is the signature produced by finding F-01 in the
  Command-Injection Chain assessment, where user input was concatenated into a
  shell command and any metacharacter in it yielded arbitrary execution.
  A web application that serves requests has no ordinary reason to start a
  shell. Where a specific application legitimately does, the exception belongs
  in this rule as a named filter rather than as a reason to lower its severity.
references:
  - reports/command-injection-chain-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.execution
  - attack.t1059.004
  - attack.initial-access
  - attack.t1190
logsource:
  category: process_creation
  product: linux
detection:
  service_account:
    User:
      - 'www-data'
      - 'nginx'
      - 'apache'
      - 'uwsgi'
      - 'gunicorn'
  shell:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
  condition: service_account and shell
falsepositives:
  - Applications that legitimately shell out, most often to image, video, or
    document conversion utilities. These are identifiable by a stable, small
    set of command lines and should be filtered explicitly by that command line
    rather than by suppressing the rule.
  - Deployment, migration, and healthcheck scripts running under the service
    account, which are usually distinguishable by running at deploy time rather
    than continuously.
level: high
---
title: Web Service Account Running Host Reconnaissance
name: webservice_recon_child
id: 7d2b6a51-4e08-49c7-9f3a-2b85ce104f6b
status: experimental
description: >
  A process running as the web application's service account executes a host
  reconnaissance command. In the Command-Injection Chain assessment this is what
  immediately followed the injection at both privilege tiers: the first action
  after proving execution was to establish which account had been obtained.
  This rule is deliberately separate from the shell rule above, because
  injection into an argument array or a non-shell exec path produces this
  without ever spawning a shell.
references:
  - reports/command-injection-chain-2026-08.md
author: ouroboros-white
date: 2026/08/27
tags:
  - attack.discovery
  - attack.t1033
  - attack.t1082
logsource:
  category: process_creation
  product: linux
detection:
  service_account:
    User:
      - 'www-data'
      - 'nginx'
      - 'apache'
      - 'uwsgi'
      - 'gunicorn'
  recon:
    Image|endswith:
      - '/id'
      - '/whoami'
      - '/uname'
      - '/hostname'
      - '/ifconfig'
      - '/netstat'
  condition: service_account and recon
falsepositives:
  - Monitoring agents and healthcheck scripts calling hostname or uname on a
    schedule, which produce a regular interval rather than a burst alongside
    other discovery commands.
level: high
